spring.application.name=sigcqal-api
server.port=8081
server.servlet.context-path=/SIGCQAL_Prod

# ===============================
# CONFIGURACIÓN DE BASE DE DATOS
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/SIGCQAL_Prod?currentSchema=public,catalogos,correspondencia,atencion_juridica
spring.datasource.username=postgres
# Asegúrate de colocar la contraseña real del usuario jdavidrivera aquí:
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# IMPORTANTE: Cambiado a 'none' para proteger la estructura de tu base de datos restaurada.
spring.jpa.hibernate.ddl-auto=none

# ===============================
# LOGGING (BASE DE DATOS)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# SUBIDA DE ARCHIVOS
# ===============================
# Permitir archivos más grandes (20MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.batch.jdbc.initialize-schema=always

# ===============================
# CONFIGURACIÓN DE OPENAPI / SWAGGER
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ===============================
# LOGGING (WEB Y ERRORES)
# ===============================
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR
# Para ver errores específicos del Multipart (subida de archivos)
logging.level.org.apache.tomcat.util.http.fileupload=DEBUG

# ===============================
# MANEJO DE ERRORES Y VALIDACIÓN
# ===============================
# Habilitar mensajes de validación detallados
server.error.include-message=always
server.error.include-binding-errors=always

# ===============================
# SEGURIDAD / JWT
# ===============================
jwt.secret=sigcqal-secret-key-debe-ser-larga-minimo-32-chars-2026
jwt.expiration=86400000