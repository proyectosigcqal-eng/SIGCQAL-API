spring.application.name=sigcqal-api
server.port=8081
server.servlet.context-path=/SIGCQAL_Prod

# ===============================
# CONFIGURACIÓN DE BASE DE DATOS
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/SIGCQAL_Prod?currentSchema=public,catalogos,correspondencia,atencion_juridica
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP Pool Tuning ────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=SigcqalHikariPool

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ===============================
# SUBIDA DE ARCHIVOS
# ===============================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ===============================
# BATCH
# ===============================
spring.batch.jdbc.initialize-schema=always

# ===============================
# OPENAPI / SWAGGER
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ===============================
# SEGURIDAD / JWT
# ===============================

# ── JWT simple (para tu JwtService existente si lo conservas) ─────────
jwt.secret=sigcqal-secret-key-debe-ser-larga-minimo-32-chars-2026
jwt.expiration=86400000

# ── CORS ────────────────────────────────────────────────────────────────
app.jwt.secret=sigcqal-secret-key-debe-ser-larga-minimo-32-chars-2026
app.jwt.access-token-expiration-ms=86400000
app.jwt.refresh-token-expiration-ms=604800000
app.security.cors-allowed-origins=http://localhost:5173,http://localhost:8081,http://38.19.36.163:8181

# ===============================
# MANEJO DE ERRORES Y VALIDACIÓN
# ===============================
server.error.include-message=always
server.error.include-binding-errors=always

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate=ERROR
logging.level.org.apache.tomcat.util.http.fileupload=DEBUG
logging.level.com.sigcqal=DEBUG